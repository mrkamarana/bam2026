<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var pathSegments = window.location.pathname.split('/');
      // If deployed to a subpath like /repo-name/, redirect back to that repo root
      window.location.replace(window.location.origin + window.location.pathname.slice(0, window.location.pathname.lastIndexOf('/') + 1));
    </script>
  </head>
  <body>
    <p>Memuat aplikasi...</p>
  </body>
</html>
